# =============================================================================
# STARTUP
# =============================================================================

# local additions
exec-once=sh ~/.config/mango/autostart.sh

# start on workspace 3
exec-once=sh -c 'sleep 0.2;mmsg dispatch view,3,0'


# =============================================================================
# ENVIRONMENT & CURSOR
# =============================================================================

env=xcursor_size,24
env=xcursor_theme,adwaita

cursor_size=24
cursor_theme=adwaita


# =============================================================================
# MONITORS
# =============================================================================

# monitor rules
monitorrule=model:MQ16FC,width:1080,height:1920,refresh:60,x:0,y:0,scale:1.0,rr:1
monitorrule=model:XG27JCG,width:5120,height:2880,refresh:165,x:0,y:0,scale:2.0
monitorrule=model:0x0067,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.0


# =============================================================================
# WINDOW RULES
# =============================================================================

windowrule=tags:4,appid:helium
windowrule=tags:5,appid:md.obsidian
windowrule=tags:7,appid:org.telegram.desktop
windowrule=tags:8,appid:discord
windowrule=tags:9,appid:steam
windowrule=tags:9,appid:stremio
windowrule=tags:10,appid:spotify


# =============================================================================
# TAG / MONITOR LAYOUT RULES
# =============================================================================

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:*,monitor_model:"0x0067",no_hide:1,layout_name:tile
tagrule=id:*,monitor_model:"XG27JCG",no_hide:1,layout_name:tile
tagrule=id:*,monitor_model:"MQ16FC",no_hide:1,layout_name:v_tile

tagrule=id:6,monitor_model:"XG27JCG",no_hide:1,open_as_floating:1



# =============================================================================
# APPEARANCE
# =============================================================================

# more option see https://github.com/dreammaomao/mango/wiki/

# appearance
gappih=10
gappiv=10
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8fba7c55
splitcolor=0xeb441eff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff


# =============================================================================
# WINDOW EFFECTS
# =============================================================================

# window effect
blur=1
blur_optimized=1
blur_layer=0
blur_params_num_passes = 2
blur_params_radius = 6
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 4
shadows_blur = 12
shadows_position_x = 2
shadows_position_y = 2
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0


# =============================================================================
# ANIMATIONS
# =============================================================================

# animation configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=180
animation_duration_tag=150
animation_duration_close=425
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1


# =============================================================================
# LAYOUTS
# =============================================================================

# scroller layout setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# master-stack layout setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=10
smartgaps=0

# dwindle layout setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0


# =============================================================================
# OVERVIEW
# =============================================================================

# overview setting
hotarea_size=10
enable_hotarea=0
overviewgappi=5
overviewgappo=30


# =============================================================================
# WINDOW MANAGEMENT BEHAVIOR
# =============================================================================

# misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=0
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
exchange_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1


# =============================================================================
# INPUT
# =============================================================================

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

devicerule=name:sonix usb device,kb_layout:us,kb_options:caps:escape

# trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0


# =============================================================================
# KEY BINDINGS
# =============================================================================

# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none


# -----------------------------------------------------------------------------
# Screenshots
# -----------------------------------------------------------------------------

# screenshots
bind=ctrl+shift,3,spawn,noctalia msg screenshot-fullscreen all
bind=ctrl+shift,4,spawn,noctalia msg screenshot-region


# -----------------------------------------------------------------------------
# Common Key Mode
# -----------------------------------------------------------------------------

# bindings available in every key mode
keymode=common
bind=alt+shift,c,reload_config
bind=alt,r,reload_config
bind=super+shift,e,quit


# -----------------------------------------------------------------------------
# ThinkPad Function Row
# -----------------------------------------------------------------------------

# thinkpad t14s gen 2 function-row hotkeys (fn+esc toggles fn lock).
# bind the hardware keysyms, leaving normal f1-f12 available to applications.
# f1-f6: audio and built-in display brightness, also available while locked.
bindl=none,xf86audiomute,spawn,noctalia msg volume-mute
bindl=none,xf86audiolowervolume,spawn,noctalia msg volume-down
bindl=none,xf86audioraisevolume,spawn,noctalia msg volume-up
bindl=none,xf86audiomicmute,spawn,noctalia msg mic-mute
bindl=none,xf86monbrightnessdown,spawn,noctalia msg brightness-down edp-1
bindl=none,xf86monbrightnessup,spawn,noctalia msg brightness-up edp-1

# f7-f9: display controls, wi-fi toggle, notification history.
bind=none,xf86display,spawn,noctalia msg panel-toggle control-center monitor
bind=none,xf86wlan,spawn,noctalia msg wifi-toggle
bind=none,xf86notificationcenter,spawn,noctalia msg panel-toggle control-center notifications

# f10/f11 (xf86pickupphone/xf86hangupphone) are left to call applications.
# f12: user-defined (star) key opens the launcher.
bind=none,xf86favorites,spawn,noctalia msg panel-toggle launcher


# -----------------------------------------------------------------------------
# Default Key Mode
# -----------------------------------------------------------------------------

# default key mode
keymode=default


# -----------------------------------------------------------------------------
# Launcher & Terminal
# -----------------------------------------------------------------------------

# menu and terminal
#bind=super,return,spawn,kitty -e zsh -c "BDUCK_TMUX_LAYOUT_START_WINDOW=4 BDUCK_TMUX_LAYOUT_SESSION_DIR=~/nixos-env/ tmuxifier load-session dev; zsh" 
bind=super,enter,spawn,kitty
bind=super,t,spawn,kitty
bind=super,d,spawn,noctalia msg panel-toggle launcher


# -----------------------------------------------------------------------------
# Window Close
# -----------------------------------------------------------------------------

# close focused window
bind=super+shift,q,killclient


# -----------------------------------------------------------------------------
# Window Focus
# -----------------------------------------------------------------------------

# focus windows with vim directions
bind=super,h,focusdir,left
bind=super,j,focusdir,down
bind=super,k,focusdir,up
bind=super,l,focusdir,right
bind=super,tab,focusstack,next
bind=alt,tab,switcher,all_tag_next


# -----------------------------------------------------------------------------
# Window Exchange
# -----------------------------------------------------------------------------

# exchange tiled windows with vim directions
#bind=super+shift,h,spawn,$home/nixos-env/config/scripts/mango-exchange-client-or-tagmon left
#bind=super+shift,j,spawn,$home/nixos-env/config/scripts/mango-exchange-client-or-tagmon down
#bind=super+shift,k,spawn,$home/nixos-env/config/scripts/mango-exchange-client-or-tagmon up
#bind=super+shift,l,spawn,$home/nixos-env/config/scripts/mango-exchange-client-or-tagmon right


# -----------------------------------------------------------------------------
# Window State
# -----------------------------------------------------------------------------

# window state
bind=super,g,toggleglobal,
bind=super,backslash,togglefloating,
bind=super,shift,space,togglefloating,
bind=super,a,togglemaximizescreen,
bind=super,f,togglefullscreen,
bind=super+shift,f,togglefakefullscreen,
bind=super,i,minimized,
bind=super,o,toggleoverlay,
bind=super+shift,i,restore_minimized
bind=super,z,toggle_scratchpad


# -----------------------------------------------------------------------------
# Layout Controls
# -----------------------------------------------------------------------------

# scroller layout
bind=alt,e,set_proportion,1.0
bind=alt,x,switch_proportion_preset,
bind=alt+super+ctrl,left,scroller_stack,left
bind=alt+super+ctrl,right,scroller_stack,right
bind=alt+super+ctrl,up,scroller_stack,up
bind=alt+super+ctrl,down,scroller_stack,down

# switch layout
bind=super+shift,n,switch_layout


# -----------------------------------------------------------------------------
# Tag Navigation
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Tag Navigation
# -----------------------------------------------------------------------------

# adjacent tag navigation
bind=super,p,viewtoleft,0
bind=super,n,viewtoright,0
bind=super,grave,view,-1,0

# monitor navigation
bind=super,m,focusmon,next

# switch to tag
bind=super,1,view,1,0
bind=super,2,view,2,0
bind=super,3,view,3,0
bind=super,4,view,4,0
bind=super,5,view,5,0
bind=super,6,view,6,0
bind=super,7,view,7,0
bind=super,8,view,8,0
bind=super,9,view,9,0
bind=super,0,view,10,0

# move focused window to tag
bind=super+shift,1,tag,1,0
bind=super+shift,2,tag,2,0
bind=super+shift,3,tag,3,0
bind=super+shift,4,tag,4,0
bind=super+shift,5,tag,5,0
bind=super+shift,6,tag,6,0
bind=super+shift,7,tag,7,0
bind=super+shift,8,tag,8,0
bind=super+shift,9,tag,9,0
bind=super+shift,0,tag,10,0


# -----------------------------------------------------------------------------
# Floating Window Movement & Resize
# -----------------------------------------------------------------------------

# movewin
bind=ctrl+shift,up,movewin,+0,-50
bind=ctrl+shift,down,movewin,+0,+50
bind=ctrl+shift,left,movewin,-50,+0
bind=ctrl+shift,right,movewin,+50,+0

# resizewin
bind=ctrl+alt,up,resizewin,+0,-50
bind=ctrl+alt,down,resizewin,+0,+50
bind=ctrl+alt,left,resizewin,-50,+0
bind=ctrl+alt,right,resizewin,+50,+0


# -----------------------------------------------------------------------------
# Mouse & Axis Bindings
# -----------------------------------------------------------------------------

# mouse button bindings
# btn_left and btn_right can't bind none mod key
mousebind=alt,btn_left,moveresize,curmove
mousebind=none,btn_middle,togglemaximizescreen,0
mousebind=alt,btn_right,moveresize,curresize

# axis bindings
axisbind=super,up,viewtoleft_have_client
axisbind=super,down,viewtoright_have_client


# -----------------------------------------------------------------------------
# Resize Key Mode
# -----------------------------------------------------------------------------

# i3-style resize mode
bind=super,r,setkeymode,resize

keymode=resize
bind=none,h,resizewin,-10,0
bind=none,j,resizewin,0,+10
bind=none,k,resizewin,0,-10
bind=none,l,resizewin,+10,0
bind=none,return,setkeymode,default
bind=none,escape,setkeymode,default
bind=alt,r,setkeymode,default


# =============================================================================
# LAYER RULES
# =============================================================================

# layer rule
layerrule=animation_type_open:zoom,layer_name:noctalia
layerrule=animation_type_close:zoom,layer_name:noctalia


# =============================================================================
# EXTERNAL CONFIG
# =============================================================================

source=~/.config/mango/noctalia.conf

[plugin_settings."noctalia/timer"]
alarm = true

[plugin_settings."noctalia/wallhaven"]
browser_position = "bottom_right"
download_dir = "/home/bduck/nixos-env/assets/wallpapers/wallhaven"

[plugins]
enabled = [
  "noctalia/bitwarden",
  "noctalia/wallhaven",
  "noctalia/timer",
  "thepunkoff/pomodoro"
]

[shell]
app_icon_color = "on_surface_variant"
corner_radius_scale = 0
font_family = "JetBrainsMono NF"
settings_show_advanced = false
settings_window_translucent = true
telemetry_enabled = true
time_format = "{:%-I:%M%p}"

  [shell.animation]
  speed = 1.5000000223517418

  [shell.panel]
  shadow = true
  transparency_mode = "glass"

  [shell.screenshot]
  save_to_file = false

[theme]
builtin = "Eldritch"
community_palette = "Koneko"
custom_palette = "Cyberdream Muted"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

  [theme.templates]
  builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt", "kcolorscheme" ]
  community_ids = [ "pywalfox", "telegram", "bat", "yazi" ]

[wallpaper]
directory = "/home/bduck/Pictures/Wallpapers"

  [wallpaper.default]
  path = "/home/bduck/nixos-env/assets/wallpapers/wallhaven/wallhaven-57od15.jpg"

  [wallpaper.last]
  path = "/home/bduck/Pictures/Wallpapers/vertical_fern.jpg"

[wallpaper.monitors.DP-1]
path = "/home/bduck/Pictures/Wallpapers/vertical_fern.jpg"

[wallpaper.monitors.DP-2]
path = "/home/bduck/Pictures/Wallpapers/cats-water.png"

[wallpaper.monitors.STREAM]
path = "/home/bduck/Pictures/Wallpapers/wallhaven-7p3we9.png"

[wallpaper.monitors.eDP-1]
path = "/home/bduck/Pictures/Wallpapers/cats-water.png"

  [[wallpaper.favorite]]
  path = "/home/bduck/Pictures/Wallpapers/japanese-city.png"
  theme_mode = "auto"

[weather]
unit = "imperial"

[widget.bar]
type = "noctalia/timer:bar"

[widget.clock]
format = "{:%A %B %-d %-I:%M%p}"

[widget.control-center]
custom_image = "/home/bduck/nixos-env/assets/nixos_logo_icon.png"
custom_image_colorize = true

[widget.launcher]
custom_image = "/home/bduck/nixos-env/assets/nixos_logo_icon.png"
custom_image_colorize = true
enabled = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
style = "minimal"


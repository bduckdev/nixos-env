[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
background_opacity = 0.7499999832361937
center = [ "widget", "clock", "bar" ]
concave_edge_corners = false
contact_shadow = true
enabled = false
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "session"
]
margin_ends = 0
padding = 10
radius = 0
shadow = true
start = [
  "control-center",
  "launcher",
  "wallhaven",
  "wallpaper",
  "workspaces"
]
widget_spacing = 8

[bar.default.monitor.builtin]
enabled = true
match = "eDP-1"

[bar.default.monitor.main]
enabled = true
match = "XG27JCG"

[bar.default.monitor.secondary]
enabled = false
match = "MQ16FC"

[bar.secondary]
center = [ "workspaces" ]
enabled = false
end = [ ]
margin_ends = 400
radius = 0
start = [ ]

[bar.secondary.monitor.builtin]
enabled = false
match = "eDP-1"

[bar.secondary.monitor.main]
enabled = false
match = "XG27JCG"

[bar.secondary.monitor.secondary]
enabled = true
match = "MQ16FC"

[calendar]
enabled = true

[calendar.account.personal_google]
type = "google"

[dock]
background_opacity = 0.789999982342124
shadow = false

[location]

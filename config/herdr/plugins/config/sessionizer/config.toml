[projects]
# Parent folders searched by the interactive pickers
# Include home-level repos such as ~/nixos-env on NixOS.
roots = ["~/Work", "~/School", "~/Personal", "~"]
# true: only git repos; false: all immediate child folders
git_only = true
# Only used when git_only = true; 1 means immediate children
depth = 1

[ui]
# How Sessionizer / Worktree pickers open in Herdr: overlay | split | popup
# popup requires Herdr >= 0.7.4 (width/height only apply to popup)
placement = "popup"
width = "90%"
height = "90%"

[layout]
# Mirrors `select_window 3` in .tmux-layouts/dev.session.sh (base-index 3 = editor)
focus = "editor"

# Tabs open in declaration order: _, _, editor, agent, server
# Every tab needs at least one [[tabs.<name>.panes]] entry; a pane with no
# command is left as a plain shell in the project directory.
[tabs.one]
label = "_"

[[tabs.one.panes]]

[tabs.two]
label = "_"

[[tabs.two.panes]]

[tabs.editor]
label = "editor"

[[tabs.editor.panes]]
id = "editor"
title = "neovim"
command = "nvim"

[tabs.agent]
label = "agent"

[[tabs.agent.panes]]
id = "agent"
title = "claude code"
command = "claude"

[tabs.server]
label = "server"

[[tabs.server.panes]]
id = "server"
title = "server"
# Only run when the project exposes a `dev` make target
command = "grep -qE '^dev *:' Makefile 2>/dev/null && make dev"
